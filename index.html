<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mythos & Metru: Chronicles of the Multiverse</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0f12;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #canvas:focus {
            outline: none;
        }
        #status {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #status-progress {
            width: 300px;
            height: 6px;
            background-color: #1f242d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid #3a4454;
        }
        #status-progress-inner {
            width: 0%;
            height: 100%;
            background-color: #d4af37; /* Mythic Gold */
            transition: width 0.1s ease-in-out;
        }
        #status-notice {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8b9bb4;
        }
    </style>
</head>
<body>
    <div id="status">
        <div id="status-notice">Loading Multiverse Archives...</div>
        <div id="status-progress">
            <div id="status-progress-inner"></div>
        </div>
    </div>

    <canvas id="canvas">
        Your browser does not support the canvas tag or WebAssembly.
    </canvas>

    <script src="index.js"></script>
    <script>
        const engine = new Engine({
            "args": [],
            "canvas": document.getElementById("canvas"),
            "locateFile": (path) => path,
            "onProgress": function(current, total) {
                if (total > 0) {
                    const percent = (current / total) * 100;
                    document.getElementById("status-progress-inner").style.width = percent + "%";
                    if (current === total) {
                        document.getElementById("status").style.display = "none";
                    }
                }
            }
        });

        engine.startGame();
    </script>
</body>
</html>
